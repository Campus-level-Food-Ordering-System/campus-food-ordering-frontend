<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Plate Animation Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #E6F7FF 0%, #ffffff 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .loading-plate-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .plate-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plate {
            width: 180px;
            height: 180px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 50%;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.1),
                inset 0 -5px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: plateRotate 3s ease-in-out infinite;
        }

        .plate-inner {
            width: 140px;
            height: 140px;
            border: 3px solid #e5e7eb;
            border-radius: 50%;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .food-items {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
        }

        .food-item {
            position: absolute;
            font-size: 32px;
            opacity: 0;
            transform: scale(0) translateY(-20px);
        }

        .food-1 {
            top: 10%;
            left: 10%;
            animation: foodAppear 2s ease-in-out 0.2s infinite;
        }

        .food-2 {
            top: 10%;
            right: 10%;
            animation: foodAppear 2s ease-in-out 0.5s infinite;
        }

        .food-3 {
            bottom: 10%;
            left: 10%;
            animation: foodAppear 2s ease-in-out 0.8s infinite;
        }

        .food-4 {
            bottom: 10%;
            right: 10%;
            animation: foodAppear 2s ease-in-out 1.1s infinite;
        }

        .utensils {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .fork,
        .knife {
            position: absolute;
            font-size: 28px;
            opacity: 0;
            animation: utensilSlide 2s ease-in-out 1.5s infinite;
        }

        .fork {
            left: -40px;
            top: 50%;
            transform: translateY(-50%) rotate(-45deg);
        }

        .knife {
            right: -40px;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            animation: utensilSlide 2s ease-in-out 1.7s infinite;
        }

        .loading-text {
            margin-top: 30px;
            font-size: 18px;
            font-weight: 600;
            color: #0077BE;
            animation: textPulse 1.5s ease-in-out infinite;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #0077BE;
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes plateRotate {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(2deg);
            }
            75% {
                transform: rotate(-2deg);
            }
        }

        @keyframes foodAppear {
            0% {
                opacity: 0;
                transform: scale(0) translateY(-20px);
            }
            20% {
                opacity: 1;
                transform: scale(1.2) translateY(0);
            }
            40% {
                transform: scale(1) translateY(0);
            }
            80% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(0.8) translateY(5px);
            }
        }

        @keyframes utensilSlide {
            0% {
                opacity: 0;
                transform: translateY(-50%) translateX(0) rotate(-45deg);
            }
            20% {
                opacity: 1;
                transform: translateY(-50%) translateX(10px) rotate(-45deg);
            }
            80% {
                opacity: 1;
                transform: translateY(-50%) translateX(10px) rotate(-45deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-50%) translateX(0) rotate(-45deg);
            }
        }

        @keyframes textPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="loading-plate-container">
        <div class="plate-wrapper">
            <!-- Plate -->
            <div class="plate">
                <div class="plate-inner"></div>
            </div>
            
            <!-- Food items appearing on plate -->
            <div class="food-items">
                <div class="food-item food-1">🍕</div>
                <div class="food-item food-2">🍔</div>
                <div class="food-item food-3">🌮</div>
                <div class="food-item food-4">🍜</div>
            </div>
            
            <!-- Utensils -->
            <div class="utensils">
                <div class="fork">🍴</div>
                <div class="knife">🔪</div>
            </div>
        </div>
        
        <!-- Loading text -->
        <p class="loading-text">Loading delicious food...</p>
        
        <!-- Loading dots -->
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</body>
</html>
